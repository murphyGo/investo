<text class="card-text" x="80" y="258" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">도미넌스는 59.18%를 유지해 알트코인 대비 상대적 우위가 이어졌다. 이번 문서는 수집 근거가</text>
