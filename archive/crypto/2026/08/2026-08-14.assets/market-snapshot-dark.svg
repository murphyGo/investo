<text class="card-text" x="80" y="460" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">확인 소스: CFTC COT · BTC 레버리지드머니 순포지션이 현재 -7,052계약(미결제약정의</text>
<text class="card-text" x="80" y="498" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">-33.3%) 수준에서, 순매도 규모가 추가로 확대되면 방어적 심리 강화로 관찰되고 순매도 폭이 축소돼</text>
