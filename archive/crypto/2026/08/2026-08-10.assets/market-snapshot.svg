<text class="card-text" x="80" y="378" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">24h 기준 -1.80% 하락하며 $63,904.00까지 내려왔다(구간 내 고가 $65,317.00,</text>
