<text class="card-text" x="80" y="460" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">확인 소스: CFTC(미국 상품선물거래위원회) BTC/ETH CME 레버리지 자금 포지셔닝 — 순매도</text>
<text class="card-text" x="80" y="498" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">비중이 현재 -35.9%(BTC)·-15.7%(ETH)보다 축소되면 숏 커버링에 따른 반등 압력을</text>
