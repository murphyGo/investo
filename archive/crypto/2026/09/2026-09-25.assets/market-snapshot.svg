<text class="card-text" x="80" y="340" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">비트코인(BTC)·이더리움(ETH) 파생시장 포지셔닝 — CFTC(상품선물거래위원회) 주간 리포트에</text>
<text class="card-text" x="80" y="378" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">따르면 비트코인(BTC) CME(시카고상업거래소) 선물에서 레버리지드머니는 롱 4,745계약, 숏</text>
