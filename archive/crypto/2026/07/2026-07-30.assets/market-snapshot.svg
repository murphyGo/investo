<text class="card-text" x="80" y="498" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">-38.7%) — 다음 주간 보고서에서 순매도 비중이 축소되면 파생 심리 개선으로 관찰되고, 순매도</text>
