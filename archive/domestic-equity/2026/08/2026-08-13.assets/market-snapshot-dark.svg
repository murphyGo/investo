<text class="card-text" x="80" y="340" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">코스피 6,813.34·코스닥 861.37 마감, 시가총액 6천조원 회복 — 코스피(KOSPI)는 13일</text>
<text class="card-text" x="80" y="378" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">6,813.34로, 코스닥(KOSDAQ)은 861.37로 거래를 마감했다(연합뉴스 코스피, 연합뉴스</text>
<text class="card-label" x="80" y="420" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="24" font-weight="700">주의할 점</text>
<text class="card-text" x="80" y="460" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">확인 소스: FRED · 원/달러 환율이 다시 1,423.61원을 상회하면 원화 약세 되돌림으로</text>
<text class="card-text" x="80" y="498" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">관찰하고, 1,400원선을 하회하면 원화 강세 심화로 해석한다.</text>
<text class="card-disclaimer" x="80" y="555" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="22">정보 제공용 시황 카드</text>
