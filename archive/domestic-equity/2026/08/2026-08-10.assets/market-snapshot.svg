<text class="card-text" x="80" y="378" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">마쳤다(연합뉴스). 코스닥은 같은 날 854.00으로 마감했다(연합뉴스). 지난 7일 각각</text>
