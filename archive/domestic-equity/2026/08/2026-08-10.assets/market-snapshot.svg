<text class="card-text" x="80" y="220" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">코스피(KOSPI, 한국 유가증권시장 종합지수)는 10일 6,299.66으로, 코스닥(KOSDAQ,</text>
<text class="card-text" x="80" y="258" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">코스닥시장 지수)은 854.00으로 거래를 마쳤다(등락률 데이터 미수집). 원/달러 환율은</text>
