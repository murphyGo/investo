<text class="card-text" x="80" y="498" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">원화 강세 흐름 지속을 관찰, 전일 수준인 1,423.61원을 다시 상회하면 원화 약세 반전 신호로</text>
