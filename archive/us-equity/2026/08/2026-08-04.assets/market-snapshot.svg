<text class="card-text" x="80" y="460" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">이번 주(8/48/11) 주요 일정으로 8/7 고용상황보고서(Employment Situation),</text>
<text class="card-text" x="80" y="498" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">8/5 연준 이사 Lisa D. Cook 연설, 8/8 부의장 Michelle W. Bowman 토론이</text>
