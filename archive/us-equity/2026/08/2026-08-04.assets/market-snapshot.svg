<text class="card-text" x="80" y="340" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">다우존스산업평균(DJI)·S&amp;P 500·나스닥종합지수(IXIC), 반도체 강세 속 동반 상승 마감 —</text>
<text class="card-text" x="80" y="378" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">다우존스산업평균(DJI)은 +1.71% 오른 54,085.88에 마감했다(O:53,641.21</text>
