<text class="card-text" x="80" y="340" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">다우·S&amp;P 500·나스닥, 소폭 하락 속 반도체 조정 — 전 거래일 미국 증시는 다우가</text>
<text class="card-text" x="80" y="378" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">53,559.99로 -0.02%, S&amp;P 500이 7,711.76으로 -0.25%, 나스닥이</text>
<text class="card-label" x="80" y="420" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="24" font-weight="700">주의할 점</text>
<text class="card-text" x="80" y="460" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">확인 소스: VIX 종가 14.43 · VIX가 당일 고가 14.84를 상회하면 변동성 확대로 관찰,</text>
<text class="card-text" x="80" y="498" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">당일 저가 14.13 아래에서 유지되면 안정 국면으로 해석. 관심 영향: 이번 주 베이지북(연준 지역경제</text>
