<text class="card-text" x="80" y="258" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">500, 나스닥종합지수(나스닥) 3대 지수가 각각 -0.02%, -0.25%, -0.52%로 나란히 소폭</text>
