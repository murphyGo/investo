<text class="card-text" x="80" y="498" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">-280,446계약(-13.2%)에서 순매도가 추가 확대되면 하방 압력 확대로 관찰, 순매도 규모가</text>
