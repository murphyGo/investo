<text class="card-text" x="80" y="378" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">다우존스산업평균지수), 원유發 금리 부담에 하락 전환 — 전일(2026-08-19) 국채 금리 하락에</text>
