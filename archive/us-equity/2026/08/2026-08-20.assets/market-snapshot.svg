<text class="card-text" x="80" y="220" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">CFTC(상품선물거래위원회) COT(트레이더별 포지션 보고서)에 따르면 E-mini S&amp;P 500 선물의</text>
<text class="card-text" x="80" y="258" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">레버리지드머니 순포지션이 -280,446계약(미결제약정 대비 -13.2%)으로 순매도 우위를 나타냈고,</text>
