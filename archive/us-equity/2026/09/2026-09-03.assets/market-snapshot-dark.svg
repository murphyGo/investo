<text class="card-text" x="80" y="460" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">확인 소스: CFTC E-mini S&amp;P 500 COT(순포지션 -315,204계약, OI 대비</text>
<text class="card-text" x="80" y="498" font-family="&quot;Noto Sans KR&quot;, Arial, sans-serif" font-size="32">-15.4%) · 이 순매도 포지션이 다음 보고서에서 축소되면 수급 개선 관찰, 추가로 확대되면 수급</text>
