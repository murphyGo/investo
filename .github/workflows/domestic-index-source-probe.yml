name: domestic-index-source-probe

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: ISO basis date to diagnose (YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '>=0.4'
      - name: Set up Python
        run: uv python install 3.11
      - name: Install source dependencies
        run: uv sync --frozen
      - name: Probe fixed index source
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          INVESTO_KRX_SERVICE_KEY: ${{ secrets.INVESTO_KRX_SERVICE_KEY }}
          INVESTO_DATA_GO_KR_SERVICE_KEY: ${{ secrets.INVESTO_DATA_GO_KR_SERVICE_KEY }}
        run: uv run python scripts/probe_domestic_index_source.py --target-date "$TARGET_DATE"
