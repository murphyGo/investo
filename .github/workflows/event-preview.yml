name: event-preview

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Price reference date (YYYY-MM-DD); preview only, never publishes.'
        required: true
        type: string
      recipient_public_key:
        description: 'Ephemeral recipient public key (64 lowercase hex characters). Keep its private key locally.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: event-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        segment: [domestic-equity, us-equity, crypto]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - run: uv python install 3.11
      - run: uv sync --locked --extra operations
      - name: Validate recipient public key
        env:
          PREVIEW_RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
        run: |
          uv run python - <<'PY'
          import os
          import re
          from nacl.public import PublicKey, SealedBox
          key = os.environ["PREVIEW_RECIPIENT_PUBLIC_KEY"]
          if not re.fullmatch(r"[0-9a-f]{64}", key):
              raise SystemExit("invalid recipient public key")
          SealedBox(PublicKey(bytes.fromhex(key))).encrypt(b"preview preflight")
          PY
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install current production CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Generate non-publishing preview
        id: preview
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          INVESTO_KRX_SERVICE_KEY: ${{ secrets.INVESTO_KRX_SERVICE_KEY }}
          INVESTO_DATA_GO_KR_SERVICE_KEY: ${{ secrets.INVESTO_DATA_GO_KR_SERVICE_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          PREVIEW_TARGET_DATE: ${{ inputs.target_date }}
          PREVIEW_SEGMENT: ${{ matrix.segment }}
        run: |
          mkdir -p .tmp
          set +e
          uv run python scripts/preview_event_briefing.py \
            --target-date "$PREVIEW_TARGET_DATE" --segment "$PREVIEW_SEGMENT" \
            --output-dir .tmp/event-preview > .tmp/event-preview-status.json
          preview_rc=$?
          set -e
          cat .tmp/event-preview-status.json
          if [ ! -f .tmp/event-preview/manifest.json ]; then
            mkdir -p -m 700 .tmp/event-preview
            cp .tmp/event-preview-status.json .tmp/event-preview/manifest.json
          fi
          echo "exit_code=$preview_rc" >> "$GITHUB_OUTPUT"
      - name: Encrypt private preview
        env:
          PREVIEW_RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
        run: >-
          uv run python scripts/seal_event_preview.py
          --input-dir .tmp/event-preview --output .tmp/event-preview.sealed
      - name: Retain ciphertext only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: event-preview-${{ matrix.segment }}
          path: .tmp/event-preview.sealed
          include-hidden-files: true # Only this exact ciphertext file is selected.
          if-no-files-found: error
          retention-days: 1
      - name: Report preview outcome
        env:
          PREVIEW_RC: ${{ steps.preview.outputs.exit_code }}
        run: |
          case "$PREVIEW_RC" in
            0) exit 0 ;;
            1|2|3) exit "$PREVIEW_RC" ;;
            *) exit 1 ;;
          esac
